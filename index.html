<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古连续潜次放行台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #e8f2f3; color: #183035; }
    button { border: 0; border-radius: 8px; padding: 9px 14px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button.link { background: none; color: #1d6c78; padding: 2px 4px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 56px; resize: vertical; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .hd { padding: 16px 22px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    .hd h1 { margin: 0 0 4px; font-size: 23px; }
    .hd-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1.6fr 1fr; grid-template-areas: "queue form" "timeline archive"; gap: 14px; padding: 14px; }
    #queuePanel { grid-area: queue; } #formPanel { grid-area: form; }
    #timelinePanel { grid-area: timeline; } #archivePanel { grid-area: archive; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 10px; padding: 14px 16px; }
    .panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .panel-h h2 { margin: 0; font-size: 17px; }
    .muted { color: #5c7378; font-size: 13px; }
    .pill { font-size: 12px; border: 1px solid #c9dadc; border-radius: 999px; padding: 3px 10px; color: #446168; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
    .card { border: 1px solid #d7e4e5; border-left-width: 5px; border-radius: 10px; padding: 11px 12px; background: #fcfefe; }
    .card.st-cleared { border-left-color: #2e8b6f; }
    .card.st-blocked { border-left-color: #c0392b; background: #fdf3f2; }
    .card.st-pending_review { border-left-color: #c98a16; background: #fdf9ef; }
    .card.st-invalid { border-left-color: #725ca6; }
    .card-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .seq { font-weight: 800; font-size: 15px; }
    .badge { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 9px; color: #fff; }
    .badge.cleared { background: #2e8b6f; }
    .badge.blocked { background: #c0392b; }
    .badge.pending_review { background: #c98a16; }
    .badge.invalid { background: #725ca6; }
    .kv { display: grid; gap: 3px; margin: 8px 0; }
    .kv div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
    .kv dt { color: #5c7378; margin: 0; } .kv dd { margin: 0; text-align: right; }
    .reasons { margin: 6px 0; padding-left: 18px; font-size: 12.5px; color: #446168; }
    .reasons li { margin: 2px 0; }
    .note { margin-top: 4px; }
    .card-actions { display: flex; gap: 10px; align-items: center; margin-top: 6px; border-top: 1px dashed #dde8e9; padding-top: 6px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    .error { margin-top: 10px; background: #fdecea; border: 1px solid #e6b3ad; color: #962d22; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .exitbox { margin-top: 14px; border-top: 2px solid #e4eeee; padding-top: 10px; }
    .exitbox form { display: flex; gap: 8px; align-items: center; }
    .exitbox input { flex: 1; }
    .timeline { display: grid; gap: 0; max-height: 320px; overflow: auto; }
    .tl-item { display: flex; gap: 10px; position: relative; padding-bottom: 14px; }
    .tl-item:not(:last-child)::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: #cfe0e2; }
    .tl-dot { width: 24px; height: 24px; border-radius: 50%; background: #2e8b6f; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: 0 0 auto; }
    .tl-body b { margin-right: 8px; }
    .archives { display: grid; gap: 6px; max-height: 320px; overflow: auto; }
    .arc { border: 1px solid #e1eaea; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    .arc summary { cursor: pointer; font-weight: 700; }
    .empty { padding: 14px; text-align: center; }
    @media (max-width: 960px) {
      .grid { grid-template-columns: 1fr; grid-template-areas: "queue" "form" "timeline" "archive"; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mountApp } from './src/pages.js';
    mountApp(document.querySelector('#app'));
  </script>
</body>
</html>
